function fh(f,v,p){const id=p+f[0],t=f[2];
 if(Array.isArray(t))return `<label>${f[1]}<select id="${id}">${t.map(o=>{const a=o.v!==undefined?o.v:o,b=o.t||o;return `<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`}).join('')}</select></label>`;
 return `<label>${f[1]}<input id="${id}" type="${t}" value="${esc(v)}" ${f[3]||''}></label>`}
function vals(F,p,r=document){const o={};F.forEach(f=>{const e=r.querySelector('#'+p+f[0]);o[f[0]]=f[2]=='number'?Number(e.value||0):f[2]=='password'?e.value:e.value.trim()});return o}
function modal(title,F,v,ok,note,btn){const m=document.createElement('div');m.className='ov';
 m.innerHTML=`<div class="card md"><h3>${title}</h3>${note?`<div>${note}</div>`:''}${F.map(f=>fh(f,v[f[0]],'m_')).join('')}<div class="row"><button class="btn" id="mo">${btn||'Simpan'}</button><button class="btn2" id="mc">Batal</button></div></div>`;
 document.body.append(m);const i=m.querySelector('input,select');i&&i.focus();
 m.querySelector('#mc').onclick=()=>m.remove();
 m.querySelector('#mo').onclick=()=>{if(ok(vals(F,'m_',m))!==false)m.remove()};
 m.onkeydown=e=>{if(e.key=='Escape')m.remove();if(e.key=='Enter'&&e.target.tagName!='BUTTON')m.querySelector('#mo').click()}}

  if(u!==db.user)return er('Username salah.');
  if(set){if(p.length<4)return er('Password minimal 4 karakter.');if(p!==$('#p2').value)return er('Ulangi password tidak sama.');db.hash=sha(p)}
  else if(sha(p)!==db.hash)return er('Password salah.');
  db.saved=$('#sv').checked?Buffer.from(p).toString('base64'):null;save();home()};
 $('.login').onkeydown=e=>{if(e.key=='Enter')go()};$('#go').onclick=go;($('#p').value?$('#go'):$('#p')).focus()}
const TABS=[['game','🎮 Daftar Game HDD'],['set','⚙️ Pengaturan']];
function home(){$('#app').innerHTML=`<header><img src="${LOGO}" style="height:40px"><b>Daftar Game</b>${TABS.map(t=>`<button class="tab ${t[0]==tab?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}<span class="sp"></span><button class="btn2" id="lo">Keluar</button></header><main id="main"></main>`;
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;home()});$('#lo').onclick=login;
 ({game:tGame,set:tSet})[tab]()}
/* ===== DAFTAR GAME HDD ===== */
let gq='',gh='';
const GF=()=>[['nama','Nama Game','text'],['hdd','Hardisk',db.hdds.map(h=>({v:h.id,t:h.nama+' ('+h.size+')'}))]],HF=[['nama','Nama Hardisk','text'],['size','Size (mis. 1 TB)','text']];
function tGame(){const M=$('#main');
 M.innerHTML=`<div class="card"><div class="row"><label>Cari game<input id="q" value="${esc(gq)}" placeholder="ketik nama game..."></label>
 <label>Hardisk<select id="h"><option value="">Semua hardisk</option>${db.hdds.map(h=>`<option value="${h.id}" ${gh==h.id?'selected':''}>${esc(h.nama)} (${esc(h.size)}) - ${db.games.filter(g=>g.hdd==h.id).length} game</option>`).join('')}</select></label>
 <button class="btn" id="ag">+ Game</button><button class="btn2" id="ah">+ Hardisk</button><button class="btn2" id="eh">Edit Hardisk</button><button class="btn2" id="dh">Hapus Hardisk</button><button class="btn2" id="csv">Export CSV</button></div>
 <div class="chips" id="ch"></div><div class="tw"><table><thead><tr><th>No</th><th>Nama Game</th><th>Hardisk</th><th>Size</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
 const H=()=>Object.fromEntries(db.hdds.map(h=>[h.id,h])),
 list=()=>{const q=gq.toLowerCase(),h=H(),L=db.games.filter(g=>(!gh||g.hdd==gh)&&g.nama.toLowerCase().includes(q)).sort((a,b)=>a.nama.localeCompare(b.nama));
  $('#ch').innerHTML=`<span class="chip">Hardisk: <b>${db.hdds.length}</b></span><span class="chip">Total entri: <b>${db.games.length}</b></span><span class="chip">Game unik: <b>${new Set(db.games.map(g=>g.nama.toLowerCase())).size}</b></span><span class="chip">Tampil: <b>${L.length}</b></span>`;
  $('#tb').innerHTML=L.map((g,i)=>`<tr><td>${i+1}</td><td>${esc(g.nama)}</td><td>${esc(h[g.hdd]?.nama)}</td><td>${esc(h[g.hdd]?.size)}</td><td class="r"><button class="bs" data-e="${g.id}">Edit</button> <button class="bs d" data-d="${g.id}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="5">Tidak ada data.</td></tr>';return L};
 list();$('#q').oninput=e=>{gq=e.target.value;list()};$('#h').onchange=e=>{gh=e.target.value;list()};
 $('#ag').onclick=()=>modal('Tambah Game',GF(),{hdd:gh||db.hdds[0]?.id},o=>{if(!o.nama)return false;db.games.push({id:nid(),nama:o.nama,hdd:+o.hdd});save();tGame()});
 $('#ah').onclick=()=>modal('Tambah Hardisk',HF,{},o=>{if(!o.nama)return false;db.hdds.push({id:nid(),nama:o.nama,size:o.size});save();tGame()});
 $('#eh').onclick=()=>{const h=db.hdds.find(x=>x.id==gh);if(!h)return toast('Pilih hardisk dulu di filter');modal('Edit Hardisk',HF,h,o=>{if(!o.nama)return false;Object.assign(h,o);save();tGame()})};
 $('#dh').onclick=()=>{const h=db.hdds.find(x=>x.id==gh);if(!h)return toast('Pilih hardisk dulu di filter');
  ask(`${esc(h.nama)} dan semua game di dalamnya (${db.games.filter(g=>g.hdd==h.id).length}) akan dihapus.`,()=>{db.games=db.games.filter(g=>g.hdd!=h.id);db.hdds=db.hdds.filter(x=>x!==h);gh='';save();tGame()})};
 $('#csv').onclick=()=>{const h=H();csv('daftar-game',['Nama Game','Hardisk','Size'],list().map(g=>[g.nama,h[g.hdd]?.nama,h[g.hdd]?.size]))};
 $('#tb').onclick=e=>{const d=e.target.dataset,g=db.games.find(x=>x.id==(d.e||d.d));
  if(d.e)modal('Edit Game',GF(),g,o=>{if(!o.nama)return false;Object.assign(g,{nama:o.nama,hdd:+o.hdd});save();list()});
  if(d.d)ask(esc(g.nama),()=>{db.games=db.games.filter(x=>x!==g);save();list()})}}
/* ===== PENGATURAN ===== */
function tSet(){$('#main').innerHTML=`<div class="card"><h3>Pengaturan</h3><p>Data tersimpan di: <code>${esc(FILE)}</code><br>Cadangan otomatis: file .backup.json dan folder <code>backup</code> (satu file per hari).</p>
 <div class="row" style="justify-content:flex-start"><button class="btn" id="pw">Ganti Password</button><button class="btn2" id="fo">Buka Folder Data</button><button class="btn2" id="bk">Backup Sekarang</button></div></div>`;
 $('#fo').onclick=()=>shell.openPath(DIR);$('#bk').onclick=()=>{save();toast('Backup tersimpan')};
 $('#pw').onclick=()=>modal('Ganti Password',[['a','Password lama','password'],['b','Password baru','password'],['c','Ulangi password baru','password']],{},o=>{
  if(sha(o.a)!==db.hash){toast('Password lama salah');return false}if(o.b.length<4){toast('Minimal 4 karakter');return false}if(o.b!==o.c){toast('Ulangi password tidak sama');return false}
  db.hash=sha(o.b);if(db.saved)db.saved=Buffer.from(o.b).toString('base64');save();toast('Password diganti')})}
load();login();
</script></body></html>
